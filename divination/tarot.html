<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAROT ARCANA | ShivaKali Ashram</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* MYSTICAL ATMOSPHERE UPGRADE */
        :root {
            --primary: #b388ff; /* Brighter purple */
            --primary-dim: #7c4dff;
            --primary-dark: #320b86;
            --accent: #ffd700; /* Gold */
            --accent-glow: #ffea00;
            --bg-void: #050208;
            --bg-panel: rgba(15, 10, 25, 0.85);
            --text-main: #f0f0f0;
            --card-border: 1px solid rgba(179, 136, 255, 0.3);
        }

        body {
            background-color: var(--bg-void);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(50, 11, 134, 0.1) 0%, transparent 60%),
                linear-gradient(0deg, rgba(0,0,0,0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.2) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        /* HEADER UPGRADE */
        header {
            background: linear-gradient(180deg, rgba(5,2,8,0.95) 0%, rgba(20,10,40,0.8) 100%);
            border-bottom: 1px solid var(--primary-dim);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 3rem 1rem;
        }

        h1 {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: 8px;
            background: linear-gradient(135deg, #ffd700 0%, #fff59d 50%, #b8860b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.4));
            animation: pulseGold 4s infinite ease-in-out;
        }

        @keyframes pulseGold {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.4)); }
            50% { filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.7)); }
        }

        /* TABLET CARD STYLING */
        .card-entry {
            background: var(--bg-panel);
            border: 1px solid rgba(179, 136, 255, 0.15);
            border-radius: 8px;
            margin-bottom: 1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .card-entry::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 2px; height: 100%;
            background: linear-gradient(180deg, var(--primary), transparent);
            opacity: 0.5;
        }

        .card-entry:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 10px 25px rgba(124, 77, 255, 0.2);
            border-color: var(--primary);
        }

        .card-entry.active {
            background: linear-gradient(135deg, rgba(25, 15, 40, 0.95), rgba(10, 5, 20, 0.98));
            border: 1px solid var(--primary);
            box-shadow: 0 0 30px rgba(124, 77, 255, 0.15);
        }

        .card-header {
            padding: 1.5rem 2rem;
            background: transparent;
        }

        .card-number {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--primary-dim);
            color: var(--primary);
            font-family: 'Orbitron';
            padding: 4px 10px;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(124, 77, 255, 0.1);
        }

        .card-entry.active .card-number {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px var(--primary);
        }

        /* ALTAR SPREAD AREA */
        .reading-area {
            background: radial-gradient(circle at center, #1a1025 0%, #0a0510 100%);
            border: 1px solid var(--primary-dim);
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
            border-radius: 12px;
            padding: 3rem;
            position: relative;
        }

        .reading-area::after {
            content: '';
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 1px dashed rgba(179, 136, 255, 0.2);
            border-radius: 8px;
            pointer-events: none;
        }

        /* MYSTICAL DECK */
        .deck-stack {
            width: 140px;
            height: 220px;
            border-radius: 10px;
            background: linear-gradient(135deg, #2a1a4a, #120820);
            border: 2px solid var(--accent);
            box-shadow: 
                0 0 0 1px #000,
                0 5px 15px rgba(0,0,0,0.5),
                0 0 20px rgba(157, 78, 221, 0.4);
            position: relative;
            transform-style: preserve-3d;
            transition: all 0.5s ease;
        }

        .deck-stack:hover {
            transform: translateY(-5px) rotateX(10deg);
            box-shadow: 
                0 0 0 1px #000,
                0 15px 30px rgba(0,0,0,0.6),
                0 0 40px rgba(157, 78, 221, 0.6);
        }

        /* CARD BACK PATTERN (CSS ONLY) */
        .card-back {
            background-color: #150a25;
            background-image: 
                radial-gradient(var(--accent) 1px, transparent 1px),
                radial-gradient(var(--primary) 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            border: 2px solid var(--accent-dim);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-back::after {
            content: '👁️';
            font-size: 2rem;
            opacity: 0.5;
            filter: drop-shadow(0 0 5px var(--primary));
        }

        .spread-btn {
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--primary-dim);
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 2px;
            backdrop-filter: blur(5px);
        }

        .spread-btn.active {
            background: var(--primary);
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 20px var(--primary-dim);
        }
        <h2 style="color: #e0e0e0; font-family: 'Cinzel'; margin: 3rem 0 1rem; text-align: center; border-bottom: 1px solid rgba(224, 224, 224, 0.3); padding-bottom: 1rem;">THE SUIT OF SWORDS (AIR)</h2>
        <div class="library-grid" id="swords-suit">
            <!-- Swords injected here -->
        </div>

        <!-- Suit of Pentacles -->
        <h2 style="color: #00ff00; font-family: 'Cinzel'; margin: 3rem 0 1rem; text-align: center; border-bottom: 1px solid rgba(0, 255, 0, 0.3); padding-bottom: 1rem;">THE SUIT OF PENTACLES (EARTH)</h2>
        <div class="library-grid" id="pentacles-suit">
            <!-- Pentacles injected here -->
        </div>

    </div>

    <!-- SPREADS SECTION -->
    <div id="spreads" class="section">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h2 style="color: var(--accent); font-family: 'Cinzel';">INTERACTIVE READINGS</h2>
            <p style="color: var(--text-dim); margin-top: 0.5rem;">Focus on your question, then select a spread.</p>
        </div>

        <div class="spread-controls">
            <button class="spread-btn" onclick="initSpread('single')">ONE CARD<br><span style="font-size:0.7em; opacity:0.7">Daily Guidance</span></button>
            <button class="spread-btn" onclick="initSpread('three')">THREE CARD<br><span style="font-size:0.7em; opacity:0.7">Past / Present / Future</span></button>
            <button class="spread-btn" onclick="initSpread('celtic')">CELTIC CROSS<br><span style="font-size:0.7em; opacity:0.7">Deep Analysis (10 Cards)</span></button>
        </div>

        <div class="reading-area" id="reading-area">
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 300px; text-align: center;">
                <div class="deck-stack" id="deck-trigger" onclick="shuffleAndDraw()"></div>
                <p style="margin-top: 1rem; color: var(--text-dim);" id="deck-instruction">Select a spread above to begin.</p>
            </div>
            <div class="active-spread" id="spread-display"></div>
            <div class="reading-output" id="reading-output"></div>
        </div>
    </div>

    <!-- WISDOM SECTION -->
    <div id="wisdom" class="section">
        <div style="text-align: center; margin-bottom: 3rem;">
            <h2 style="color: var(--accent); font-family: 'Cinzel';">OCCULT KNOWLEDGE BASE</h2>
            <p style="color: var(--text-dim);">The architecture of the Tarot system.</p>
        </div>

        <div class="content-inner" style="grid-template-columns: 1fr; gap: 3rem;">
            
            <!-- Numerology -->
            <div style="background: rgba(10, 5, 16, 0.8); padding: 2rem; border: 1px solid var(--primary-dim);">
                <h3 style="color: var(--primary); font-family: 'Orbitron'; border-bottom: 1px solid var(--primary); padding-bottom: 0.5rem; margin-bottom: 1.5rem;">NUMEROLOGY OF TAROT</h3>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem;">
                    <div><strong style="color:var(--accent)">1 (Aces):</strong> New beginnings, potential, raw energy.</div>
                    <div><strong style="color:var(--accent)">2:</strong> Duality, choice, balance, partnership.</div>
                    <div><strong style="color:var(--accent)">3:</strong> Creation, expansion, groups, growth.</div>
                    <div><strong style="color:var(--accent)">4:</strong> Structure, stability, stagnation, rest.</div>
                    <div><strong style="color:var(--accent)">5:</strong> Conflict, change, loss, instability.</div>
                    <div><strong style="color:var(--accent)">6:</strong> Harmony, restoration, alignment, help.</div>
                    <div><strong style="color:var(--accent)">7:</strong> Reflection, assessment, strategy, deception.</div>
                    <div><strong style="color:var(--accent)">8:</strong> Power, movement, mastery, restriction.</div>
                    <div><strong style="color:var(--accent)">9:</strong> Fulfillment, climax, near-completion, solitude.</div>
                    <div><strong style="color:var(--accent)">10:</strong> Completion, end of cycle, excess, ruin/legacy.</div>
                </div>
            </div>

            <!-- Elements -->
            <div style="background: rgba(10, 5, 16, 0.8); padding: 2rem; border: 1px solid var(--primary-dim);">
                <h3 style="color: var(--primary); font-family: 'Orbitron'; border-bottom: 1px solid var(--primary); padding-bottom: 0.5rem; margin-bottom: 1.5rem;">ELEMENTAL MATRIX</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                    <div>
                        <h4 style="color: #ff5500; margin-bottom: 0.5rem;">🔥 FIRE (Wands)</h4>
                        <p>Action, Will, Passion, Spirit. Fast, hot, active energy. Deals with career, creativity, and ambition.</p>
                    </div>
                    <div>
                        <h4 style="color: #00aaff; margin-bottom: 0.5rem;">💧 WATER (Cups)</h4>
                        <p>Emotion, Intuition, Love, Subconscious. Fluid, deep, passive energy. Deals with relationships and feelings.</p>
                    </div>
                    <div>
                        <h4 style="color: #e0e0e0; margin-bottom: 0.5rem;">🌬️ AIR (Swords)</h4>
                        <p>Intellect, Logic, Conflict, Truth. Fast, sharp, cutting energy. Deals with thoughts, communication, and strife.</p>
                    </div>
                    <div>
                        <h4 style="color: #00ff00; margin-bottom: 0.5rem;">🌍 EARTH (Pentacles)</h4>
                        <p>Matter, Body, Money, Nature. Slow, stable, grounded energy. Deals with health, wealth, and resources.</p>
                    </div>
                </div>
            </div>

            <!-- Court Cards -->
            <div style="background: rgba(10, 5, 16, 0.8); padding: 2rem; border: 1px solid var(--primary-dim);">
                <h3 style="color: var(--primary); font-family: 'Orbitron'; border-bottom: 1px solid var(--primary); padding-bottom: 0.5rem; margin-bottom: 1.5rem;">THE COURT ARCHETYPES</h3>
                <ul style="list-style: none; display: grid; gap: 1rem;">
                    <li><strong style="color:var(--accent)">PAGE:</strong> The Messenger. Childlike, learning, new news. Earthy part of the suit.</li>
                    <li><strong style="color:var(--accent)">KNIGHT:</strong> The Actor. Teenager/Young Adult. Action, movement, quest. Fiery part of the suit.</li>
                    <li><strong style="color:var(--accent)">QUEEN:</strong> The Mother. Internal mastery. Nurturing, deep, magnetic. Watery part of the suit.</li>
                    <li><strong style="color:var(--accent)">KING:</strong> The Father. External mastery. Authority, control, stability. Airy part of the suit.</li>
                </ul>
            </div>

            <!-- Shadow Work -->
            <div style="background: rgba(20, 0, 0, 0.6); padding: 2rem; border: 1px solid var(--danger);">
                <h3 style="color: var(--danger); font-family: 'Orbitron'; border-bottom: 1px solid var(--danger); padding-bottom: 0.5rem; margin-bottom: 1.5rem;">SHADOW INTEGRATION</h3>
                <p style="margin-bottom: 1rem;">Tarot is not just for prediction; it is a mirror for the unconscious. When a card appears Reversed, or triggers fear, it is pointing to a Shadow Aspect.</p>
                <p><strong>The Shadow Rule:</strong> What you reject in the card is what you are rejecting in yourself.</p>
            </div>

        </div>
    </div>

    <script>
        // Tab Logic
        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // Accordion Logic
        function toggleCard(element) {
            const entry = element.parentElement;
            entry.classList.toggle('active');
        }

        // MAJOR ARCANA DATA (Phases 1-4)
        const majorArcana = [
            {
                number: "0",
                name: "THE FOOL",
                archetype: "Infinite Potential & The Leap of Faith",

                planet: "Uranus",

                reversed: "Manipulation, trickery, wasted talent. Using power for selfish, harmful ends. The con artist. Knowing what to do but refusing to do it. Latent potential rotting.",
                shadow: "Do you use your words to create or destroy? The Magician's shadow is the manipulator who bends reality to gaslight others. Check your intent."
            },
            {
                number: "II",

                reversed: "Repressed intuition. Ignoring your gut feeling and paying the price. Secrets revealed. Superficiality. Being disconnected from your feminine/receptive side.",
                shadow: "Are you hiding behind 'mystery' to avoid vulnerability? Or are you ignoring the red flags your intuition is screaming at you?"
            },
            {

            },
            {

            {

            {

        // READING HISTORY LOGIC
        function saveReading(spreadName, historyData) {
            const history = JSON.parse(localStorage.getItem('tarotHistory') || '[]');
            const reading = {
                date: new Date().toLocaleString(),
                spread: spreadName,
                cards: historyData.map(c => `${c.card.name} (${c.isReversed ? 'Rx' : 'Up'})`)
            };
            history.unshift(reading);
            if (history.length > 5) history.pop(); // Keep last 5
            localStorage.setItem('tarotHistory', JSON.stringify(history));
            loadHistory();
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('tarotHistory') || '[]');
            const list = document.getElementById('history-list');
            if (history.length === 0) return;
            
            list.innerHTML = history.map(h => `
                <div class="history-item">
                    <div style="color: var(--accent); font-size: 0.9rem;">${h.date}</div>
                    <div style="color: var(--primary); font-weight: bold;">${h.spread}</div>
                    <div style="color: var(--text-dim); font-size: 0.8rem; margin-top: 0.5rem;">${h.cards.join(', ')}</div>

        // PARTICLE SYSTEM
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = `rgba(157, 78, 221, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            for (let i = 0; i < 50; i++) particles.push(new Particle());
        }
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        initParticles();
        animateParticles();
