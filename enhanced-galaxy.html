<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Galaxy Background</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
        }

        /* Enhanced Stars using Box Shadows */
        .stars {
            position: fixed;
            width: 100%;
            height: 100%;
            transform: rotate(150deg);
            animation: rotateStars 300s linear infinite;
        }

        .stars::before {
            content: '';
            position: absolute;
            width: 1px;
            height: 1px;
            background: transparent;
            box-shadow: 
                1744px 122px #FFF,
                134px 1321px #FFF,
                571px 1238px #FFF,
                1793px 148px #FFF,
                1076px 1108px #FFF,
                320px 1839px #FFF,
                1784px 1179px #FFF,
                1675px 489px #FFF,
                1334px 1762px #FFF,
                571px 1238px #FFF,
                1793px 148px #FFF,
                1076px 1108px #FFF,
                320px 1839px #FFF,
                1784px 1179px #FFF,
                1675px 489px #FFF,
                1334px 1762px #FFF,
                1793px 148px #FFF,
                1076px 1108px #FFF,
                320px 1839px #FFF,
                1784px 1179px #FFF,
                571px 1238px #FFF,
                1793px 148px #FFF,
                1076px 1108px #FFF,
                320px 1839px #FFF,
                1784px 1179px #FFF,
                1675px 489px #FFF,
                1334px 1762px #FFF,
                1793px 148px #FFF,
                1076px 1108px #FFF,
                320px 1839px #FFF,
                1784px 1179px #FFF;
            animation: twinkle 5s infinite;
        }

        .stars::after {
            content: '';
            position: absolute;
            width: 2px;
            height: 2px;
            background: transparent;
            box-shadow: 
                1744px 122px #FFF,
                134px 1321px #FFF,
                571px 1238px #FFF,
                1793px 148px #FFF,
                1076px 1108px #FFF,
                320px 1839px #FFF,
                1784px 1179px #FFF,
                1675px 489px #FFF,
                1334px 1762px #FFF,
                571px 1238px #FFF,
                1793px 148px #FFF,
                1076px 1108px #FFF,
                320px 1839px #FFF,
                1784px 1179px #FFF,
                1675px 489px #FFF,
                1334px 1762px #FFF;
            animation: twinkle 4s infinite 1s;
        }

        /* Enhanced Nebulas */
        .nebula-field {
            position: fixed;
            width: 100%;
            height: 100%;
            opacity: 0.8;
            filter: blur(80px);
            mix-blend-mode: screen;
        }

        .nebula-1 {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(ellipse at center, 
                    rgba(128, 0, 255, 0.3) 0%, 
                    rgba(128, 0, 255, 0.1) 30%,
                    transparent 60%);
            animation: nebulaPulse 20s infinite alternate;
        }

        .nebula-2 {
            position: absolute;
            top: -30%;
            right: -30%;
            width: 150%;
            height: 150%;
            background: 
                radial-gradient(ellipse at center, 
                    rgba(0, 128, 255, 0.3) 0%, 
                    rgba(0, 128, 255, 0.1) 30%,
                    transparent 60%);
            animation: nebulaPulse 25s infinite alternate-reverse;
        }

        .nebula-3 {
            position: absolute;
            bottom: -40%;
            right: -40%;
            width: 180%;
            height: 180%;
            background: 
                radial-gradient(ellipse at center, 
                    rgba(255, 100, 150, 0.2) 0%, 
                    rgba(255, 100, 150, 0.1) 30%,
                    transparent 60%);
            animation: nebulaPulse 22s infinite;
        }

        /* Spiral Galaxy */
        .galaxy {
            position: absolute;
            width: 800px;
            height: 800px;
            opacity: 0.7;
            filter: blur(3px) brightness(1.5);
            mix-blend-mode: screen;
            animation: galaxySpin 200s linear infinite;
        }

        .galaxy-1 {
            top: 10%;
            right: -20%;
            background: 
                radial-gradient(circle at 50% 50%,
                    rgba(255, 186, 115, 0.7) 0%,
                    rgba(255, 123, 0, 0.4) 20%,
                    transparent 60%),
                conic-gradient(from 0deg at 50% 50%,
                    transparent 0deg,
                    rgba(255, 215, 0, 0.3) 30deg,
                    transparent 60deg,
                    rgba(255, 215, 0, 0.3) 90deg,
                    transparent 120deg,
                    rgba(255, 215, 0, 0.3) 150deg,
                    transparent 180deg,
                    rgba(255, 215, 0, 0.3) 210deg,
                    transparent 240deg,
                    rgba(255, 215, 0, 0.3) 270deg,
                    transparent 300deg,
                    rgba(255, 215, 0, 0.3) 330deg,
                    transparent 360deg);
        }

        .galaxy-2 {
            bottom: -10%;
            left: -20%;
            background: 
                radial-gradient(circle at 50% 50%,
                    rgba(63, 137, 255, 0.7) 0%,
                    rgba(32, 89, 255, 0.4) 20%,
                    transparent 60%),
                conic-gradient(from 45deg at 50% 50%,
                    transparent 0deg,
                    rgba(63, 137, 255, 0.3) 30deg,
                    transparent 60deg,
                    rgba(63, 137, 255, 0.3) 90deg,
                    transparent 120deg,
                    rgba(63, 137, 255, 0.3) 150deg,
                    transparent 180deg,
                    rgba(63, 137, 255, 0.3) 210deg,
                    transparent 240deg,
                    rgba(63, 137, 255, 0.3) 270deg,
                    transparent 300deg,
                    rgba(63, 137, 255, 0.3) 330deg,
                    transparent 360deg);
            animation: galaxySpin 250s linear infinite reverse;
        }

        /* Cosmic Dust */
        .cosmic-dust {
            position: fixed;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.15;
            mix-blend-mode: screen;
            animation: drift 30s linear infinite;
        }

        /* Deep Space Vignette */
        .space-depth {
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center,
                transparent 0%,
                transparent 40%,
                rgba(0, 0, 0, 0.5) 100%);
            pointer-events: none;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.3; }
        }

        @keyframes rotateStars {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes nebulaPulse {
            0%, 100% {
                opacity: 0.8;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.1);
            }
        }

        @keyframes galaxySpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes drift {
            from { background-position: 0 0; }
            to { background-position: 100% 100%; }
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #fff, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        p {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.9);
            max-width: 600px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <!-- Background Layers -->
    <div class="stars"></div>
    
    <div class="nebula-field">
        <div class="nebula-1"></div>
        <div class="nebula-2"></div>
        <div class="nebula-3"></div>
    </div>
    
    <div class="galaxy galaxy-1"></div>
    <div class="galaxy galaxy-2"></div>
    
    <div class="cosmic-dust"></div>
    <div class="space-depth"></div>

    <!-- Content -->
    <div class="content">
        <h1>Deep Space</h1>
        <p>Journey through the infinite cosmos, where galaxies dance and nebulae paint the void.</p>
    </div>
</body>
</html>
