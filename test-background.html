<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Background Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* Enhanced Cosmic Background System */
        :root {
            --mystic-black: #0A0821;
            --deep-space: #1A1035;
            
            /* Star Colors */
            --star-white: rgba(255, 255, 255, 0.9);
            --star-gold: rgba(255, 215, 0, 0.8);
            
            /* Galaxy Colors */
            --galaxy-blue: rgba(63, 81, 181, 0.5);
            --galaxy-purple: rgba(156, 39, 176, 0.5);
            --galaxy-gold: rgba(255, 215, 0, 0.3);
            --galaxy-indigo: rgba(103, 58, 183, 0.4);
            
            /* Nebula Colors */
            --nebula-pink: rgba(233, 30, 99, 0.4);
            --nebula-blue: rgba(33, 150, 243, 0.4);
        }

        /* Base Space Layer */
        .space-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: 
                radial-gradient(
                    circle at 25% 25%, 
                    rgba(103, 58, 183, 0.2) 0%, 
                    transparent 50%
                ),
                radial-gradient(
                    circle at 75% 75%, 
                    rgba(156, 39, 176, 0.2) 0%, 
                    transparent 50%
                ),
                linear-gradient(
                    180deg, 
                    var(--mystic-black) 0%, 
                    var(--deep-space) 50%, 
                    var(--mystic-black) 100%
                );
            opacity: 1;
        }

        /* Star System */
        .star-field {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-image: 
                radial-gradient(1px 1px at 5% 5%, var(--star-white) 1px, transparent 0),
                radial-gradient(1px 1px at 15% 25%, var(--star-white) 1px, transparent 0),
                radial-gradient(1px 1px at 25% 45%, var(--star-white) 1px, transparent 0),
                radial-gradient(1px 1px at 35% 65%, var(--star-white) 1px, transparent 0),
                radial-gradient(1px 1px at 45% 85%, var(--star-white) 1px, transparent 0),
                radial-gradient(1px 1px at 55% 5%, var(--star-white) 1px, transparent 0),
                radial-gradient(1px 1px at 65% 25%, var(--star-white) 1px, transparent 0),
                radial-gradient(1px 1px at 75% 45%, var(--star-white) 1px, transparent 0),
                radial-gradient(1px 1px at 85% 65%, var(--star-white) 1px, transparent 0),
                radial-gradient(1px 1px at 95% 85%, var(--star-white) 1px, transparent 0);
            opacity: 0.9;
            animation: starlight 4s infinite alternate;
        }

        .bright-stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background-image:
                radial-gradient(2px 2px at 10% 10%, var(--star-gold) 1px, transparent 0),
                radial-gradient(2px 2px at 30% 30%, var(--star-white) 1px, transparent 0),
                radial-gradient(2px 2px at 50% 50%, var(--star-gold) 1px, transparent 0),
                radial-gradient(2px 2px at 70% 70%, var(--star-white) 1px, transparent 0),
                radial-gradient(2px 2px at 90% 90%, var(--star-gold) 1px, transparent 0);
            opacity: 0.7;
            animation: starlight 6s infinite alternate-reverse;
        }

        /* Galaxy System */
        .galaxy-field {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            overflow: hidden;
        }

        .galaxy-core-1 {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(
                    ellipse at center, 
                    var(--galaxy-purple) 0%, 
                    rgba(156, 39, 176, 0.2) 30%, 
                    transparent 60%
                );
            filter: blur(60px);
            animation: galaxyPulse 15s infinite alternate;
            transform-origin: center;
            mix-blend-mode: screen;
        }

        .galaxy-core-2 {
            position: absolute;
            bottom: -30%;
            right: -30%;
            width: 180%;
            height: 180%;
            background: 
                radial-gradient(
                    ellipse at center, 
                    var(--galaxy-blue) 0%, 
                    rgba(63, 81, 181, 0.2) 30%, 
                    transparent 60%
                );
            filter: blur(70px);
            animation: galaxyPulse 20s infinite alternate-reverse;
            transform-origin: center;
            mix-blend-mode: screen;
        }

        /* Nebula System */
        .nebula-field {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            overflow: hidden;
        }

        .nebula-core-1 {
            position: absolute;
            top: -30%;
            right: -30%;
            width: 150%;
            height: 150%;
            background: 
                radial-gradient(
                    ellipse at center, 
                    var(--nebula-pink) 0%, 
                    rgba(233, 30, 99, 0.1) 40%, 
                    transparent 70%
                );
            filter: blur(80px);
            animation: nebulaDrift 20s infinite alternate;
            mix-blend-mode: screen;
        }

        .nebula-core-2 {
            position: absolute;
            bottom: -40%;
            left: -40%;
            width: 170%;
            height: 170%;
            background: 
                radial-gradient(
                    ellipse at center, 
                    var(--nebula-blue) 0%, 
                    rgba(33, 150, 243, 0.1) 40%, 
                    transparent 70%
                );
            filter: blur(90px);
            animation: nebulaDrift 25s infinite alternate-reverse;
            mix-blend-mode: screen;
        }

        @keyframes starlight {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 0.6; }
        }

        @keyframes galaxyPulse {
            0% { 
                transform: scale(1) rotate(0deg);
                filter: blur(60px);
            }
            100% { 
                transform: scale(1.1) rotate(90deg);
                filter: blur(80px);
            }
        }

        @keyframes nebulaDrift {
            0% {
                transform: translateX(-5%) scale(1);
                filter: blur(80px);
            }
            100% {
                transform: translateX(5%) scale(1.1);
                filter: blur(100px);
            }
        }

        /* Content */
        .content {
            position: relative;
            z-index: 10;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <!-- Enhanced Cosmic Background System -->
    <div class="space-background"></div>
    
    <div class="star-system">
        <div class="star-field"></div>
        <div class="bright-stars"></div>
    </div>

    <div class="galaxy-field">
        <div class="galaxy-core-1"></div>
        <div class="galaxy-core-2"></div>
    </div>

    <div class="nebula-field">
        <div class="nebula-core-1"></div>
        <div class="nebula-core-2"></div>
    </div>

    <div class="content">
        <h1>Eternal Space Background</h1>
        <p>A test of the enhanced cosmic background system with multi-layered stars, galaxies, and nebulas.</p>
    </div>

</body>
</html>
