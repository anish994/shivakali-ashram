<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Galaxy Background</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(180deg, #000000 0%, #0f0c29 50%, #302b63 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-family: Arial, sans-serif;
            position: relative;
        }

        /* Deep Space Base */
        .space-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 25% 25%, 
                    rgba(103, 58, 183, 0.2) 0%, 
                    transparent 50%),
                radial-gradient(circle at 75% 75%, 
                    rgba(156, 39, 176, 0.2) 0%, 
                    transparent 50%);
            opacity: 0.8;
        }

        /* Nebula swirling effects */
        .nebula {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 50% 50%, rgba(255, 0, 255, 0.3) 0%, transparent 70%),
                radial-gradient(circle at 20% 80%, rgba(0, 255, 255, 0.3) 0%, transparent 70%),
                radial-gradient(circle at 80% 20%, rgba(255, 255, 0, 0.3) 0%, transparent 70%);
            filter: blur(50px);
            animation: swirl 20s infinite linear, pulse 5s infinite alternate;
            mix-blend-mode: screen;
        }

        /* Additional Nebula Layers */
        .nebula-field {
            position: fixed;
            width: 100%;
            height: 100%;
            opacity: 0.8;
            mix-blend-mode: screen;
        }

        .nebula-layer {
            position: absolute;
            width: 150%;
            height: 150%;
            animation: nebulaFloat 25s infinite alternate ease-in-out;
        }

        .nebula-1 {
            top: -25%;
            left: -25%;
            background: 
                radial-gradient(ellipse at center, 
                    rgba(128, 0, 255, 0.4) 0%, 
                    rgba(128, 0, 255, 0.1) 30%,
                    transparent 70%);
            filter: blur(60px);
            animation-delay: -5s;
        }

        .nebula-2 {
            bottom: -25%;
            right: -25%;
            background: 
                radial-gradient(ellipse at center, 
                    rgba(0, 255, 255, 0.4) 0%, 
                    rgba(0, 255, 255, 0.1) 30%,
                    transparent 70%);
            filter: blur(70px);
            animation-delay: -10s;
        }

        /* Spiral Galaxy */
        .galaxy {
            position: absolute;
            width: 1000px;
            height: 1000px;
            opacity: 0.7;
            filter: blur(3px) brightness(1.5);
            mix-blend-mode: screen;
            animation: galaxySpin 150s linear infinite;
        }

        .galaxy-1 {
            top: -20%;
            right: -20%;
            background: 
                radial-gradient(circle at 50% 50%,
                    rgba(255, 186, 115, 0.7) 0%,
                    rgba(255, 123, 0, 0.4) 20%,
                    transparent 60%),
                conic-gradient(from 0deg at 50% 50%,
                    transparent 0deg,
                    rgba(255, 215, 0, 0.3) 30deg,
                    transparent 60deg,
                    rgba(255, 215, 0, 0.3) 90deg,
                    transparent 120deg,
                    rgba(255, 215, 0, 0.3) 150deg,
                    transparent 180deg,
                    rgba(255, 215, 0, 0.3) 210deg,
                    transparent 240deg,
                    rgba(255, 215, 0, 0.3) 270deg,
                    transparent 300deg,
                    rgba(255, 215, 0, 0.3) 330deg,
                    transparent 360deg);
        }

        .galaxy-2 {
            bottom: -25%;
            left: -25%;
            background: 
                radial-gradient(circle at 50% 50%,
                    rgba(63, 137, 255, 0.7) 0%,
                    rgba(32, 89, 255, 0.4) 20%,
                    transparent 60%),
                conic-gradient(from 45deg at 50% 50%,
                    transparent 0deg,
                    rgba(63, 137, 255, 0.3) 30deg,
                    transparent 60deg,
                    rgba(63, 137, 255, 0.3) 90deg,
                    transparent 120deg,
                    rgba(63, 137, 255, 0.3) 150deg,
                    transparent 180deg,
                    rgba(63, 137, 255, 0.3) 210deg,
                    transparent 240deg,
                    rgba(63, 137, 255, 0.3) 270deg,
                    transparent 300deg,
                    rgba(63, 137, 255, 0.3) 330deg,
                    transparent 360deg);
            animation: galaxySpin 180s linear infinite reverse;
        }

        /* Stars container */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            perspective: 300px;
            transform-style: preserve-3d;
        }

        /* Dynamic star styling */
        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            animation: twinkle var(--twinkle-duration) infinite alternate;
            box-shadow: 0 0 var(--glow-size) rgba(255, 255, 255, 0.8);
            transform: translateZ(var(--star-depth));
        }

        /* Shooting stars */
        .shooting-star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #ffffff;
            box-shadow: 
                0 0 10px #ffffff,
                0 0 20px #ffffff,
                0 0 30px rgba(255, 255, 255, 0.5);
            animation: shoot var(--shoot-duration) infinite linear;
            opacity: 0;
        }

        /* Cosmic Dust */
        .cosmic-dust {
            position: fixed;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.15;
            mix-blend-mode: screen;
            animation: drift 30s linear infinite;
        }

        /* Animations */
        @keyframes swirl {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { opacity: 0.5; filter: blur(50px); }
            100% { opacity: 1; filter: blur(70px); }
        }

        @keyframes twinkle {
            0% { 
                opacity: var(--min-opacity); 
                transform: scale(0.8); 
            }
            100% { 
                opacity: var(--max-opacity); 
                transform: scale(1.2); 
            }
        }

        @keyframes shoot {
            0% {
                transform: translate(120vw, -20vh) rotate(45deg);
                opacity: 1;
            }
            100% {
                transform: translate(-20vw, 120vh) rotate(45deg);
                opacity: 0;
            }
        }

        @keyframes nebulaFloat {
            0% {
                transform: translate(0, 0) scale(1);
                filter: blur(60px);
            }
            100% {
                transform: translate(50px, 30px) scale(1.1);
                filter: blur(70px);
            }
        }

        @keyframes galaxySpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes drift {
            0% { background-position: 0 0; }
            100% { background-position: 100% 100%; }
        }

        /* Content styling */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #ffffff, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        p {
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.9);
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <!-- Background Layers -->
    <div class="space-background"></div>
    <div class="nebula"></div>
    
    <div class="nebula-field">
        <div class="nebula-layer nebula-1"></div>
        <div class="nebula-layer nebula-2"></div>
    </div>
    
    <div class="galaxy galaxy-1"></div>
    <div class="galaxy galaxy-2"></div>
    
    <div class="stars" id="stars"></div>
    <div class="cosmic-dust"></div>

    <!-- Content -->
    <div class="content">
        <h1>Infinite Cosmos</h1>
        <p>Journey through the eternal dance of galaxies, where nebulae paint the void and stars guide the way to infinity.</p>
    </div>

    <script>
        // Enhanced star generation with depth and varied animations
        const starsContainer = document.getElementById('stars');
        const numStars = 400;
        
        for (let i = 0; i < numStars; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            
            // Random star properties
            const size = Math.random() * 3 + 1;
            const depth = Math.random() * 200 - 100;
            const minOpacity = Math.random() * 0.3 + 0.2;
            const maxOpacity = Math.random() * 0.4 + 0.6;
            const twinkleDuration = Math.random() * 3 + 2 + 's';
            const glowSize = size * 2 + 'px';
            
            // Apply random styles
            star.style.setProperty('--star-depth', depth + 'px');
            star.style.setProperty('--min-opacity', minOpacity);
            star.style.setProperty('--max-opacity', maxOpacity);
            star.style.setProperty('--twinkle-duration', twinkleDuration);
            star.style.setProperty('--glow-size', glowSize);
            
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            
            starsContainer.appendChild(star);
        }

        // Dynamic shooting stars
        function createShootingStar() {
            const shootingStar = document.createElement('div');
            shootingStar.className = 'shooting-star';
            
            // Random duration between 2-4 seconds
            const duration = (Math.random() * 2 + 2) + 's';
            shootingStar.style.setProperty('--shoot-duration', duration);
            
            starsContainer.appendChild(shootingStar);
            
            // Remove shooting star after animation
            setTimeout(() => {
                shootingStar.remove();
            }, parseFloat(duration) * 1000);
        }

        // Create new shooting stars randomly
        setInterval(() => {
            if (Math.random() < 0.5) { // 50% chance each interval
                createShootingStar();
            }
        }, 2000);
    </script>
</body>
</html>
