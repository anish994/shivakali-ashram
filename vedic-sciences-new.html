<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>वेद विज्ञान | Vedic Sciences</title>
    <meta name="theme-color" content="#0a0821">

    <style>
        /* Enhanced Cosmic Background System */
        :root {
            /* Core Colors */
            --cosmic-black: #000000;
            --divine-gold: #FFD700;
            --mystic-purple: #9400D3;
            --celestial-blue: #4FACFE;
            --sacred-red: #FF4444;
            --pure-white: #FFFFFF;
            
            /* Enhanced Space Colors */
            --star-color-1: rgba(255, 255, 255, 0.9);
            --star-color-2: rgba(255, 215, 0, 0.8);
            --galaxy-blue: rgba(63, 81, 181, 0.3);
            --galaxy-purple: rgba(156, 39, 176, 0.3);
            --galaxy-gold: rgba(255, 215, 0, 0.15);
            --nebula-pink: rgba(233, 30, 99, 0.2);
            --nebula-blue: rgba(33, 150, 243, 0.2);
            --space-blur-1: 30px;
            --space-blur-2: 60px;

            /* Base Theme */
            --mystic-black: #0A0821;
            --deep-space: #1A1035;
            --cosmic-gradient: linear-gradient(135deg, var(--mystic-purple) 0%, var(--celestial-blue) 100%);
            --gold-glow: rgba(255, 215, 0, 0.15);
            --card-bg: rgba(0, 0, 0, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--mystic-black);
            color: var(--pure-white);
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            position: relative;
        }

        /* Base Space Background */
        .cosmic-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        /* Deep Space Layer */
        .deep-space {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 25% 25%, var(--galaxy-purple) 0%, transparent 50%),
                radial-gradient(ellipse at 75% 75%, var(--galaxy-blue) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, var(--galaxy-gold) 0%, transparent 60%);
            filter: blur(var(--space-blur-1));
            opacity: 0.8;
            animation: space-pulse 15s infinite alternate;
            mix-blend-mode: screen;
        }

        /* Nebula Fields */
        .nebula-field {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(1600px 1000px at 20% 30%, var(--nebula-pink) 0%, transparent 70%),
                radial-gradient(1400px 1200px at 70% 60%, var(--nebula-blue) 0%, transparent 70%);
            filter: blur(var(--space-blur-2));
            opacity: 0.6;
            animation: nebula-drift 20s infinite alternate;
            mix-blend-mode: screen;
            transform-origin: center;
        }

        /* Star Layers */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .stars-small {
            z-index: 1;
            background-image: 
                radial-gradient(1px 1px at 5% 5%, var(--star-color-1) 1px, transparent 0),
                radial-gradient(1px 1px at 15% 25%, var(--star-color-1) 1px, transparent 0),
                radial-gradient(1px 1px at 25% 45%, var(--star-color-1) 1px, transparent 0),
                radial-gradient(1px 1px at 35% 65%, var(--star-color-1) 1px, transparent 0),
                radial-gradient(1px 1px at 45% 85%, var(--star-color-1) 1px, transparent 0),
                radial-gradient(1px 1px at 55% 5%, var(--star-color-1) 1px, transparent 0),
                radial-gradient(1px 1px at 65% 25%, var(--star-color-1) 1px, transparent 0),
                radial-gradient(1px 1px at 75% 45%, var(--star-color-1) 1px, transparent 0),
                radial-gradient(1px 1px at 85% 65%, var(--star-color-1) 1px, transparent 0),
                radial-gradient(1px 1px at 95% 85%, var(--star-color-1) 1px, transparent 0);
            opacity: 0.8;
            animation: twinkle-small 4s infinite alternate;
        }

        .stars-medium {
            z-index: 2;
            background-image: 
                radial-gradient(1.5px 1.5px at 10% 10%, var(--star-color-2) 1px, transparent 0),
                radial-gradient(1.5px 1.5px at 30% 30%, var(--star-color-2) 1px, transparent 0),
                radial-gradient(1.5px 1.5px at 50% 50%, var(--star-color-2) 1px, transparent 0),
                radial-gradient(1.5px 1.5px at 70% 70%, var(--star-color-2) 1px, transparent 0),
                radial-gradient(1.5px 1.5px at 90% 90%, var(--star-color-2) 1px, transparent 0);
            opacity: 0.6;
            animation: twinkle-medium 6s infinite alternate-reverse;
        }

        .stars-large {
            z-index: 3;
            background-image: 
                radial-gradient(2px 2px at 20% 20%, var(--star-color-1) 1px, transparent 0),
                radial-gradient(2px 2px at 40% 40%, var(--star-color-2) 1px, transparent 0),
                radial-gradient(2px 2px at 60% 60%, var(--star-color-1) 1px, transparent 0),
                radial-gradient(2px 2px at 80% 80%, var(--star-color-2) 1px, transparent 0);
            opacity: 0.7;
            animation: twinkle-large 8s infinite alternate;
        }

        /* Cosmic Animations */
        @keyframes twinkle-small {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.5; }
        }

        @keyframes twinkle-medium {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 0.3; }
        }

        @keyframes twinkle-large {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 0.4; }
        }

        @keyframes space-pulse {
            0% { 
                opacity: 0.8;
                transform: scale(1);
            }
            100% { 
                opacity: 0.6;
                transform: scale(1.1);
            }
        }

        @keyframes nebula-drift {
            0% {
                filter: blur(var(--space-blur-2));
                transform: translateX(-5px) scale(1);
            }
            100% {
                filter: blur(calc(var(--space-blur-2) + 10px));
                transform: translateX(5px) scale(1.05);
            }
        }

        /* Vignette Overlay */
        .vignette-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                ellipse at center,
                transparent 0%,
                transparent 50%,
                rgba(0, 0, 0, 0.4) 100%
            );
            pointer-events: none;
            z-index: 4;
        }

        /* Mobile Optimizations */
        @media (max-width: 768px) {
            .stars-medium,
            .stars-large {
                display: none;
            }

            .stars-small {
                opacity: 0.6;
            }

            .nebula-field {
                opacity: 0.4;
                filter: blur(calc(var(--space-blur-2) - 20px));
            }

            .deep-space {
                opacity: 0.6;
                filter: blur(calc(var(--space-blur-1) - 10px));
            }
        }

        /* Reduce Motion */
        @media (prefers-reduced-motion: reduce) {
            .stars,
            .nebula-field,
            .deep-space {
                animation: none;
            }
        }

        [Your existing styles here]
    </style>
</head>
<body>
    <!-- Enhanced Cosmic Background System -->
    <div class="cosmic-background">
        <div class="deep-space"></div>
        <div class="nebula-field"></div>
        <div class="stars stars-small"></div>
        <div class="stars stars-medium"></div>
        <div class="stars stars-large"></div>
        <div class="vignette-overlay"></div>
    </div>

    [Your existing content here]

</body>
</html>
