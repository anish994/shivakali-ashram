<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="auraGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="0%" style="stop-color:currentColor;stop-opacity:0.6"/>
            <stop offset="70%" style="stop-color:currentColor;stop-opacity:0.3"/>
            <stop offset="100%" style="stop-color:currentColor;stop-opacity:0"/>
        </radialGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Aura circles -->
    <circle cx="32" cy="32" r="30" fill="url(#auraGradient)" class="aura-ring"/>
    <circle cx="32" cy="32" r="26" fill="url(#auraGradient)" class="aura-ring"/>

    <!-- Mane rays -->
    <g class="mane-rays" filter="url(#glow)">
        <path d="M32 2l3 12-3-3-3 3 3-12z"/>
        <path d="M48 5l-6 10 0-4-4 2 10-8z"/>
        <path d="M59 21l-12 3 3-3-3-3 12 3z"/>
        <path d="M55 42l-10-6 4 0-2-4 8 10z"/>
        <path d="M32 62l-3-12 3 3 3-3-3 12z"/>
        <path d="M16 59l6-10 0 4 4-2-10 8z"/>
        <path d="M5 43l12-3-3 3 3 3-12-3z"/>
        <path d="M9 22l10 6-4 0 2 4-8-10z"/>
    </g>

    <!-- Lion head main shape -->
    <g class="lion-face" filter="url(#glow)">
        <!-- Main head -->
        <path d="M32 12c-11 0-20 9-20 20s9 20 20 20 20-9 20-20-9-20-20-20zm0 36c-8.8 0-16-7.2-16-16s7.2-16 16-16 16 7.2 16 16-7.2 16-16 16z"/>
        
        <!-- Eyes -->
        <circle cx="26" cy="28" r="2"/>
        <circle cx="38" cy="28" r="2"/>
        
        <!-- Nose -->
        <path d="M32 34l-3 4h6l-3-4z"/>
        
        <!-- Mane details -->
        <path d="M20 24c-1-3-1-6 0-9 2 2 3 5 2 8"/>
        <path d="M44 24c1-3 1-6 0-9-2 2-3 5-2 8"/>
        <path d="M26 16c-3-1-6-1-9 0 2 2 5 3 8 2"/>
        <path d="M38 16c3-1 6-1 9 0-2 2-5 3-8 2"/>
    </g>
</svg>